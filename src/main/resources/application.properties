# Common configuration
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# FSS Financial Product API
fss.api.base-url=${FSS_API_BASE_URL:https://finlife.fss.or.kr}
fss.api.auth=${FSS_API_KEY}
fss.api.deposit-path=${FSS_DEPOSIT_PATH:/finlifeapi/depositProductsSearch.json}
fss.api.saving-path=${FSS_SAVING_PATH:/finlifeapi/savingProductsSearch.json}
fss.api.top-fin-grp-no=${FSS_TOP_FIN_GRP_NO:020000}
fss.api.financial-company-code=${FSS_FINANCIAL_COMPANY_CODE:}
fss.api.page-no=${FSS_PAGE_NO:1}
# JWT
jwt.secret=${JWT_SECRET}
jwt.access-token-expires-in=${JWT_ACCESS_TOKEN_EXPIRES_IN:1800}
jwt.refresh-token-expires-in=${JWT_REFRESH_TOKEN_EXPIRES_IN:1209600}
# Redis key prefixes
redis.key-prefix.refresh-token=${REDIS_REFRESH_TOKEN_PREFIX:refreshToken:}
redis.key-prefix.mydata-token=${REDIS_MYDATA_TOKEN_PREFIX:mydata-token:}
# OpenAI Responses API
openai.api-key=${OPENAI_API_KEY}
openai.model=${OPENAI_DEFAULT_MODEL:gpt-5-nano}
openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
openai.timeout-ms=${OPENAI_TIMEOUT_MS:30000}
# MyData Mock Server
mydata.api.base-url=${MYDATA_API_BASE_URL}
mydata.api.authorize-path=${MYDATA_AUTHORIZE_PATH:/mock/oauth/authorize}
mydata.api.token-path=${MYDATA_TOKEN_PATH:/mock/oauth/token}
mydata.api.accounts-path=${MYDATA_ACCOUNTS_PATH:/mock/accounts}
mydata.api.transactions-path=${MYDATA_TRANSACTIONS_PATH:/mock/transactions}
mydata.oauth.client-secret=${MYDATA_CLIENT_SECRET}
# Youth Policy API
youth-policy.api.base-url=${YOUTH_POLICY_API_BASE_URL:https://www.youthcenter.go.kr}
youth-policy.api.policy-path=${YOUTH_POLICY_PATH:/opi/youthPlcyList.do}
youth-policy.api.key=${YOUTH_POLICY_API_KEY}
youth-policy.api.page-size=${YOUTH_POLICY_PAGE_SIZE:10}
